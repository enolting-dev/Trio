name: Copy caregiver match secret
on:
  workflow_dispatch:
jobs:
  copy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Copy vault credential
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: printf "%s" "$MATCH_PASSWORD" | gh secret set MATCH_PASSWORD --repo enolting-dev/TrioCaregiver
      - name: Remove temporary workflow
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          SHA=$(gh api repos/enolting-dev/Trio/contents/.github/workflows/copy-caregiver-match-secret.yml?ref=${GITHUB_REF_NAME} --jq .sha)
          gh api --method DELETE repos/enolting-dev/Trio/contents/.github/workflows/copy-caregiver-match-secret.yml -f message="Remove temporary caregiver secret bridge" -f sha="$SHA" -f branch="$GITHUB_REF_NAME" >/dev/null
