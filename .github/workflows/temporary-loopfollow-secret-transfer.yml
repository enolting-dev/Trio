name: Temporary LoopFollow signing secret transfer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Store existing Match password in LoopFollow secret
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          MATCH_VALUE: ${{ secrets.MATCH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$MATCH_VALUE"
          printf '%s' "$MATCH_VALUE" | gh secret set MATCH_PASSWORD --repo enolting-dev/LoopFollow
